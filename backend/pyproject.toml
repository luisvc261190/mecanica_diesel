[project]
name = "ltd-backend"
version = "0.1.0"
description = "Backend SaaS multi-tenant para talleres de vehículos diésel (Laboratorio de Tecnología Diesel)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "PyJWT>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",
    # FastAPI declara dependencias como `param: T = Depends(dep)` en defaults de
    # firma por convención; migrar a Annotated[..., Depends(...)] cuando toque.
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]